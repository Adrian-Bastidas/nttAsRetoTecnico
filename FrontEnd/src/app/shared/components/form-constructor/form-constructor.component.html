<div class="sizeCard">
  <div class="create-form">
    <div class="form-container">
      <div class="back-button" *ngIf="showBackButton">
        <div
          class="btn-back"
          (click)="goBack()"
          role="button"
          tabindex="0"
          [attr.aria-label]="backButtonLabel"
        >
          <i class="fa fa-arrow-left" aria-hidden="true"></i>
          {{ backButtonLabel }}
        </div>
      </div>

      <h2>{{ title }}</h2>

      <form
        [formGroup]="formGroup"
        (ngSubmit)="handleSubmit($event)"
        novalidate
      >
        <div class="search-client-section" *ngIf="hasSearchClientField()">
          <div class="form-group">
            <label for="client-search-input">Buscar Cliente</label>
            <div class="search-input-wrapper">
              <input
                id="client-search-input"
                type="text"
                [(ngModel)]="searchClientTerm"
                [ngModelOptions]="{ standalone: true }"
                [placeholder]="getSearchClientPlaceholder()"
                [disabled]="isSearchClientDisabled()"
                class="search-client-input"
              />
              <button
                type="button"
                class="btn-search-client"
                (click)="handleSearchClient()"
                [disabled]="
                  !searchClientTerm ||
                  searchClientTerm.trim() === '' ||
                  isSearchClientDisabled()
                "
              >
                <i class="fa fa-search" aria-hidden="true"></i>
                Buscar
              </button>
            </div>
          </div>

          <div class="client-info" *ngIf="clientData">
            <h3>Información del Cliente</h3>
            <div class="client-info-grid">
              <div class="info-item" *ngFor="let item of getClientInfoFields()">
                <span class="info-label">{{ item.label }}:</span>
                <span class="info-value">{{ item.value }}</span>
              </div>
            </div>
          </div>

          <div class="divider"></div>
        </div>

        <div class="form-grid" [ngStyle]="getGridStyle()">
          <div class="form-group" *ngFor="let field of getNonSearchFields()">
            <label [for]="field.name + '-input'">{{ field.label }}</label>

            <select
              *ngIf="field.type === 'select'"
              [id]="field.name + '-input'"
              [formControlName]="field.name"
              [class.error]="isFieldInvalid(field.name)"
            >
              <option value="" disabled selected>
                {{ field.placeholder || "Seleccione una opción" }}
              </option>
              <option
                *ngFor="let option of field.options"
                [value]="option.value"
              >
                {{ option.label }}
              </option>
            </select>

            <input
              *ngIf="field.type !== 'select'"
              [id]="field.name + '-input'"
              [formControlName]="field.name"
              [type]="field.type || 'text'"
              [attr.maxlength]="field.maxLength || null"
              [placeholder]="field.placeholder || ''"
              [readonly]="field.readonly || false"
              [class.error]="isFieldInvalid(field.name)"
              (input)="handleInput($event, field)"
              (keydown)="handleKeydown($event, field)"
            />

            <div
              *ngIf="isFieldInvalid(field.name)"
              class="error-message"
              role="alert"
            >
              {{ getErrorMessage(field) }}
            </div>
          </div>
        </div>

        <div class="buttons">
          <button
            *ngFor="let button of buttons"
            [type]="button.type"
            [class]="button.class || 'btn-default'"
            [disabled]="isButtonDisabled(button)"
            (click)="handleButtonClick(button, $event)"
          >
            {{ button.label }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
