<div class="list-component">
  <div class="search-products">
    <div class="search-header">
      <app-search (searchChange)="searchChange($event)"></app-search>
      <button class="add-button" (click)="goToAddClient()">Agregar</button>
    </div>
  </div>
  <div class="product-list-container">
    <app-table-constructor
      [columns]="columns"
      [data]="filteredRows"
      [currentPage]="currentPage"
      [maxPage]="maxPage"
      [deleteFunction]="openDeleteModal"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
      [editRoute]="'/addClient'"
    ></app-table-constructor>
  </div>
</div>

<app-delete-constructor [title]="'cliente'" (deleteFunc)="deleteClient($event)">
</app-delete-constructor>
